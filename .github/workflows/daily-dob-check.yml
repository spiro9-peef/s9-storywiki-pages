name: Daily Birthday Check

on:
  schedule:
    # Runs exactly at 08:00 AM UTC (1:00 AM PST) every single day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to trigger it manually via the GitHub UI anytime

jobs:
  check:
    runs-on: ubuntu-latest
    
    # You must explicitly declare 'contents: read' (or 'write') 
    # so the runner is allowed to look at your repository files.
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pyyaml requests

      - name: Run Birthday Script
        run: python bday_check.py
        
        # --- KEEP-ALIVE STEP ---
      - name: Prevent inactivity shutdown
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true # Uses the GitHub API instead of dummy commits to avoid cluttering your git log