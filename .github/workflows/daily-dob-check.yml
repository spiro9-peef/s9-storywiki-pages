name: Daily Birthday Check

on:
  schedule:
    # Runs exactly at 08:00 AM UTC (1:00 AM PST) every single day
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to trigger it manually via the GitHub UI anytime

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pyyaml requests

      - name: Run Birthday Script
        run: python bday_check.py
        
        # --- KEEP-ALIVE STEP ---
      - name: Commit and push activity log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          date -u > last_checked.txt
          git add last_checked.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "[skip ci] KEEP ALIVE"
          
          # Push using the token explicitly to bypass permission blocks
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main