name: KEEPALIVE

on:
  schedule:
    # Runs once every 1st of the month at midnight
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows you to trigger it manually via the GitHub UI anytime

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
        # --- KEEP-ALIVE STEP ---
      - name: Commit and push activity log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          date -u > last_checked.txt
          git add last_checked.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Keep repository active, update checker"
          
          # Push using the token explicitly to bypass permission blocks
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main